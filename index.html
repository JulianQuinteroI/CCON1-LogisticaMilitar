<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mando Caribe · Atlas Logístico — Centro de Mando Geoespacial</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
:root{
  --bg-abismo:#e9eef5; --bg-panel:#ffffff; --bg-panel2:#f3f6fb;
  --glass-bg:rgba(255,255,255,.74); --glass-bg-solid:rgba(255,255,255,.97);
  --glass-brd:rgba(30,64,110,.16); --glass-brd-hi:rgba(8,145,178,.5);
  --tinta:#13243b; --tinta-tenue:#46607d; --tinta-mut:#7286a0;
  --cian:#0891b2; --cian-d:#0e7490; --ambar:#c2740a; --indigo:#4f46e5;
  --verde:#16a34a; --amarillo:#d97706; --rojo:#e11d48;
  --otan:#1d4ed8;
  --armada:#2563eb; --ejercito:#16a34a; --fac:#0891b2; --conjunto:#7c3aed;
  --grad-titulo:linear-gradient(120deg,#0891b2,#4f46e5 58%,#c2740a);
  --grad-acento:linear-gradient(90deg,#0891b2,#d97706);
  --r-sm:8px; --r:14px; --r-lg:22px;
  --sombra:0 12px 32px -16px rgba(30,60,110,.30);
  --glow-cian:0 0 0 1px rgba(8,145,178,.22),0 0 22px -6px rgba(8,145,178,.38);
  --blur:16px; --sb:248px; --sb-collapsed:72px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg-abismo);color:var(--tinta);font:15px/1.55 'Manrope',system-ui,-apple-system,sans-serif;overflow:hidden}
a{color:var(--cian);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#dde5ef}
::-webkit-scrollbar-thumb{background:#b4c2d6;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#93a7c2}
::selection{background:rgba(34,211,238,.35)}

.app{display:flex;height:100vh;overflow:hidden}

/* ---------- Sidebar ---------- */
aside.sidebar{
  width:var(--sb);flex:0 0 var(--sb);height:100vh;position:relative;z-index:700;
  background:linear-gradient(180deg,#ffffff,#eef3f9);border-right:1px solid var(--glass-brd);
  display:flex;flex-direction:column;transition:width .3s cubic-bezier(.22,1,.36,1),flex-basis .3s cubic-bezier(.22,1,.36,1);
  overflow:hidden;
}
.app.collapsed aside.sidebar{width:var(--sb-collapsed);flex-basis:var(--sb-collapsed)}
.sb-brand{display:flex;align-items:center;gap:12px;padding:18px 16px 16px;border-bottom:1px solid var(--glass-brd);position:relative;overflow:hidden}
.sb-brand::after{content:"";position:absolute;left:-30%;bottom:0;width:40%;height:2px;background:linear-gradient(90deg,transparent,var(--cian),transparent);animation:scan 7s linear infinite}
@keyframes scan{0%{left:-40%}100%{left:130%}}
.brand-mark{width:40px;height:40px;border-radius:11px;flex:0 0 auto;position:relative;background:radial-gradient(circle at 30% 25%,#e6f6fb,#ffffff);border:1px solid var(--glass-brd-hi);display:grid;place-items:center;box-shadow:var(--glow-cian)}
.brand-mark svg{width:23px;height:23px}
.brand-mark .ring{position:absolute;inset:-5px;border:1px solid rgba(34,211,238,.3);border-radius:14px;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sb-brand .bt{min-width:0;white-space:nowrap;opacity:1;transition:opacity .2s}
.app.collapsed .sb-brand .bt{opacity:0;pointer-events:none}
.sb-brand .bt h1{font:600 16px/1 'Oswald';letter-spacing:.13em;margin:0;text-transform:uppercase;background:var(--grad-titulo);-webkit-background-clip:text;background-clip:text;color:transparent}
.sb-brand .bt .sub{color:var(--tinta-mut);font-size:10.5px;letter-spacing:.04em;margin-top:3px}

.sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 10px}
.sb-group{font:600 10px 'Oswald';letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-mut);padding:14px 12px 7px;white-space:nowrap}
.app.collapsed .sb-group{opacity:0;height:8px;padding:4px 0}
.sb-item{display:flex;align-items:center;gap:13px;width:100%;background:none;border:none;color:var(--tinta-tenue);
  font:500 13.5px 'Manrope';padding:11px 12px;border-radius:10px;cursor:pointer;white-space:nowrap;position:relative;transition:background .2s,color .2s;margin:2px 0}
.sb-item svg{width:20px;height:20px;flex:0 0 auto;opacity:.85}
.sb-item:hover{background:rgba(120,160,220,.08);color:var(--tinta)}
.sb-item.active{background:linear-gradient(90deg,rgba(34,211,238,.16),rgba(34,211,238,.02));color:var(--cian)}
.sb-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--grad-acento);box-shadow:0 0 10px var(--cian)}
.sb-item .lbl{transition:opacity .2s}
.app.collapsed .sb-item .lbl{opacity:0;pointer-events:none}
.app.collapsed .sb-item{justify-content:center;padding:11px 0}
.app.collapsed .sb-nav .sb-item .tip{display:none}

.sb-foot{border-top:1px solid var(--glass-brd);padding:12px 14px;font-family:'JetBrains Mono';font-size:11px;color:var(--tinta-mut);display:flex;flex-direction:column;gap:8px}
.sb-foot .st{display:flex;align-items:center;gap:8px;white-space:nowrap}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--verde);box-shadow:0 0 8px var(--verde);animation:blink 2.4s ease-in-out infinite;flex:0 0 auto}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.app.collapsed .sb-foot .lbl2{display:none}
#clock{color:var(--cian)}
.sb-collapse{margin:8px 10px 12px;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(120,160,220,.07);border:1px solid var(--glass-brd);color:var(--tinta-tenue);border-radius:9px;padding:9px;cursor:pointer;font:500 11.5px 'Oswald';letter-spacing:.1em;text-transform:uppercase;transition:.2s}
.sb-collapse:hover{border-color:var(--glass-brd-hi);color:var(--cian)}
.sb-collapse svg{width:16px;height:16px;transition:transform .3s}
.app.collapsed .sb-collapse svg{transform:rotate(180deg)}
.app.collapsed .sb-collapse .lbl{display:none}

/* ---------- Content ---------- */
.content{flex:1;height:100vh;overflow:hidden;position:relative}
.content-scroll{height:100vh;overflow-y:auto;overflow-x:hidden;position:relative;display:flex;flex-direction:column}
.content-scroll::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(30,64,110,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(30,64,110,.05) 1px,transparent 1px);
  background-size:42px 42px;mask-image:radial-gradient(ellipse 120% 80% at 50% 0%,#000 55%,transparent 100%)}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:14px 24px;background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.62));backdrop-filter:blur(10px);border-bottom:1px solid var(--glass-brd)}
.topbar .vt{font:600 15px 'Oswald';letter-spacing:.12em;text-transform:uppercase;color:var(--tinta)}
.topbar .vd{color:var(--tinta-mut);font-size:12px}
.topbar .classif{margin-left:auto;border:1px solid rgba(245,165,36,.4);color:var(--ambar);padding:4px 11px;border-radius:20px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.menu-btn{display:none;background:none;border:1px solid var(--glass-brd);border-radius:9px;color:var(--tinta);width:38px;height:38px;cursor:pointer}

.view{display:none;position:relative;z-index:1}
.view.active{display:block;animation:viewin .45s cubic-bezier(.22,1,.36,1)}
/* el mapa llena el espacio restante (sin números mágicos: escala con el zoom) */
#mapa.view.active{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
@keyframes viewin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pad{padding:22px 24px 70px}
.section-label{font:600 12px 'Oswald';letter-spacing:.18em;text-transform:uppercase;color:var(--tinta-tenue);margin:30px 0 14px;display:flex;align-items:center;gap:10px}
.section-label::before{content:"";width:18px;height:2px;background:var(--grad-acento);border-radius:2px}
.section-label:first-child{margin-top:4px}

.glass{background:var(--glass-bg);border:1px solid var(--glass-brd);border-radius:var(--r);backdrop-filter:blur(var(--blur));box-shadow:var(--sombra);position:relative;overflow:hidden}
.glass::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent)}
.card{background:var(--glass-bg);border:1px solid var(--glass-brd);border-radius:var(--r);backdrop-filter:blur(var(--blur));box-shadow:var(--sombra);padding:18px 20px;position:relative;transition:transform .25s cubic-bezier(.22,1,.36,1),border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);border-color:var(--glass-brd-hi);box-shadow:var(--sombra),var(--glow-cian)}
.reveal{opacity:0;transform:translateY(18px)}
.reveal.in{opacity:1;transform:none;transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px}
.kpi{padding:16px 18px}
.kpi .v{font:800 30px/1 'JetBrains Mono';color:var(--tinta);letter-spacing:-.02em}
.kpi .v .u{font-size:15px;color:var(--cian);margin-left:3px}
.kpi .l{color:var(--tinta-tenue);font-size:12px;margin-top:8px}
.kpi .s{color:var(--ambar);font-size:11px;margin-top:6px;font-weight:600}

/* Map */
#map{height:100%;width:100%;background:#dbe6f1}
#mapView{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
.leaflet-container{background:#dbe6f1;font-family:'Manrope'}
.leaflet-popup-content-wrapper{background:var(--glass-bg-solid);color:var(--tinta);border:1px solid var(--glass-brd-hi);border-radius:12px;box-shadow:var(--sombra)}
.leaflet-popup-tip{background:var(--glass-bg-solid);border:1px solid var(--glass-brd-hi)}
.leaflet-popup-content{margin:14px 16px}
.popup h4{margin:0 0 4px;font:600 15px 'Oswald';letter-spacing:.04em;color:var(--cian)}
.popup .tag{font-size:10.5px;color:var(--tinta-tenue);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.popup table{font-size:12.5px;border-collapse:collapse;width:100%}
.popup td{padding:2px 0;vertical-align:top}
.popup td:first-child{color:var(--tinta-tenue);padding-right:12px;white-space:nowrap}
.popup td:last-child{font-family:'JetBrains Mono';font-size:12px}
.popup .natohead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mk{position:relative;display:grid;place-items:center;border-radius:50%;border:2px solid #fff;color:#04121a;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.6)}
.mk.pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid currentColor;animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.natomk{filter:drop-shadow(0 2px 5px rgba(0,0,0,.7))}
.natomk.crit{animation:natopulse 2.4s ease-in-out infinite}
@keyframes natopulse{0%,100%{filter:drop-shadow(0 0 0 rgba(63,134,214,0))}50%{filter:drop-shadow(0 0 9px rgba(120,180,255,.9))}}
.dept-marker{display:grid;place-items:center;font:700 11px 'JetBrains Mono';color:#fff;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 3px 10px rgba(30,60,110,.4)}
.map-panel{position:absolute;z-index:500;background:var(--glass-bg-solid);border:1px solid var(--glass-brd);border-radius:14px;backdrop-filter:blur(var(--blur));box-shadow:var(--sombra)}
.map-legend{top:14px;right:14px;padding:10px 12px;font-size:12.5px;max-width:240px;max-height:calc(100% - 28px);overflow:hidden}
.map-legend .lg-head{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.map-legend .lg-head b{display:block;font:600 11px 'Oswald';letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-tenue);margin:0;flex:1}
.map-legend .lg-head .chev{width:18px;height:18px;flex:0 0 auto;color:var(--tinta-mut);transition:transform .3s}
.map-legend.collapsed .lg-head .chev{transform:rotate(-90deg)}
.map-legend .lg-body{max-height:60vh;overflow:auto;margin-top:8px;transition:max-height .3s ease,opacity .25s,margin-top .3s}
.map-legend.collapsed .lg-body{max-height:0;opacity:0;margin-top:0;overflow:hidden}
.map-legend .row{display:flex;align-items:center;gap:9px;padding:4px 6px;border-radius:7px;cursor:pointer;user-select:none;transition:background .2s}
.map-legend .row:hover{background:rgba(120,160,220,.1)}
.map-legend .row.off{opacity:.38}
.map-legend .row.aor .dot{background:var(--ambar)!important}
.map-legend .lg-sep{height:1px;background:var(--glass-brd);margin:6px 2px}
.map-legend .dot{width:13px;height:13px;border-radius:50%;flex:0 0 auto;border:2px solid rgba(255,255,255,.25)}
.map-legend .swatch{width:16px;height:11px;border-radius:2px;flex:0 0 auto}
.detail{top:0;right:0;height:100%;width:370px;max-width:90vw;border-radius:0;border-left:1px solid var(--glass-brd-hi);transform:translateX(105%);transition:transform .4s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;z-index:520}
.detail.open{transform:none}
.detail .dh{padding:18px 20px 14px;border-bottom:1px solid var(--glass-brd)}
.detail .dh .badge{display:inline-block;font:600 10px 'Oswald';letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;border-radius:20px;margin-bottom:8px}
.detail .dh h3{margin:0;font:600 19px 'Oswald';letter-spacing:.04em}
.detail .dh .cap{color:var(--tinta-tenue);font-size:12.5px;margin-top:3px;font-family:'JetBrains Mono'}
.detail .db{padding:16px 20px;overflow:auto;flex:1}
.detail .x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:8px;border:1px solid var(--glass-brd);background:rgba(255,255,255,.04);color:var(--tinta);cursor:pointer;font-size:16px;line-height:1}
.detail .x:hover{border-color:var(--rojo);color:var(--rojo)}
.minilabel{font:600 10.5px 'Oswald';letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-mut);margin:16px 0 8px}
.detail p.syn{font-size:13px;color:var(--tinta-tenue);line-height:1.55}

.grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.chart{padding:16px 18px}
.chart h3{margin:0 0 2px;font:600 14px 'Oswald';letter-spacing:.06em;color:var(--tinta);text-transform:uppercase}
.chart .hint{color:var(--tinta-mut);font-size:11.5px;margin-bottom:10px}
.ec{width:100%}
.col-12{grid-column:span 12}.col-8{grid-column:span 8}.col-6{grid-column:span 6}.col-4{grid-column:span 4}.col-7{grid-column:span 7}.col-5{grid-column:span 5}
@media(max-width:1000px){.col-8,.col-6,.col-4,.col-7,.col-5{grid-column:span 12}}
.seg{display:inline-flex;gap:3px;background:rgba(15,30,60,.05);border:1px solid var(--glass-brd);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{background:none;border:none;color:var(--tinta-tenue);font:500 12px 'Manrope';padding:6px 13px;border-radius:7px;cursor:pointer;transition:.2s}
.seg button.on{background:var(--grad-acento);color:#04121a;font-weight:700}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 14px}
.toolbar input,.toolbar select{background:#ffffff;border:1px solid var(--glass-brd);color:var(--tinta);padding:9px 13px;border-radius:10px;font:14px 'Manrope';outline:none;transition:border-color .2s,box-shadow .2s}
.toolbar input{min-width:260px}
.toolbar input:focus,.toolbar select:focus{border-color:var(--glass-brd-hi);box-shadow:var(--glow-cian)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chips button{background:rgba(15,30,60,.04);border:1px solid var(--glass-brd);color:var(--tinta-tenue);padding:7px 14px;border-radius:20px;cursor:pointer;font:500 12.5px 'Manrope';transition:.2s}
.chips button:hover{color:var(--tinta);border-color:var(--glass-brd-hi)}
.chips button.on{background:var(--grad-acento);color:#04121a;border-color:transparent;font-weight:700}
.count{color:var(--tinta-mut);font-size:12.5px;font-family:'JetBrains Mono'}
.tablewrap{overflow:auto;max-height:calc(100vh - 230px);border:1px solid var(--glass-brd);border-radius:var(--r)}
table.data{border-collapse:collapse;width:100%;font-size:13px}
table.data th,table.data td{padding:10px 14px;text-align:left;border-bottom:1px solid rgba(120,160,220,.09);vertical-align:middle}
table.data th{position:sticky;top:0;background:var(--bg-panel);color:var(--tinta-tenue);font:600 11px 'Oswald';letter-spacing:.08em;text-transform:uppercase;cursor:pointer;user-select:none;white-space:nowrap;z-index:2}
table.data th:hover{color:var(--cian)}
table.data tbody tr{transition:background .15s}
table.data tbody tr:hover{background:rgba(34,211,238,.06)}
table.data td.num{text-align:right;font-family:'JetBrains Mono';font-size:12.5px}
.cellbar{position:relative;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.cellbar i{height:6px;border-radius:4px;background:linear-gradient(90deg,var(--cian-d),var(--cian));display:inline-block}
.pill{padding:2px 10px;border-radius:20px;font:700 10.5px 'Oswald';letter-spacing:.06em;display:inline-block;text-transform:uppercase}
.pill.A{background:rgba(52,211,153,.16);color:var(--verde)}
.pill.M{background:rgba(251,191,36,.16);color:var(--amarillo)}
.pill.B{background:rgba(251,113,133,.16);color:var(--rojo)}
.dotf{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}

#net{height:calc(100vh - 220px);min-height:460px}
.net-legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:6px;font-size:12.5px;color:var(--tinta-tenue)}
.net-legend span{display:inline-flex;align-items:center;gap:7px}
.net-legend i{width:11px;height:11px;border-radius:50%}

/* Doctrina */
.expediente{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;padding:22px 24px}
.expediente .seal{width:88px;height:88px;border-radius:16px;flex:0 0 auto;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#e6f6fb,#ffffff);border:1px solid var(--glass-brd-hi);box-shadow:var(--glow-cian)}
.expediente .seal svg{width:46px;height:46px}
.expediente .meta{flex:1;min-width:280px}
.expediente .meta h2{margin:0 0 4px;font:600 23px 'Oswald';letter-spacing:.04em;background:var(--grad-titulo);-webkit-background-clip:text;background-clip:text;color:transparent}
.expediente .meta .res{font-family:'JetBrains Mono';color:var(--cian);font-size:13px;margin-bottom:10px}
.expediente .meta .row2{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:12.5px;color:var(--tinta-tenue)}
.expediente .meta .row2 b{color:var(--tinta);font-weight:600}
.defcard{margin:0 24px;font-size:13.5px;color:var(--tinta-tenue);line-height:1.6;padding:18px 20px}
.defcard em{color:var(--cian);font-style:normal}
.timeline{position:relative;display:flex;margin:8px 4px 0;padding:10px 0}
.timeline::before{content:"";position:absolute;left:0;right:0;top:34px;height:2px;background:linear-gradient(90deg,var(--cian),var(--indigo),var(--ambar));border-radius:2px;transform-origin:left;animation:drawline 1.2s cubic-bezier(.22,1,.36,1)}
@keyframes drawline{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tphase{flex:1;text-align:center;position:relative;padding-top:48px}
.tphase .node{position:absolute;top:26px;left:50%;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;background:var(--bg-abismo);border:3px solid var(--cian);box-shadow:0 0 12px var(--cian)}
.tphase .ph{font:600 11px 'Oswald';letter-spacing:.1em;color:var(--cian);text-transform:uppercase}
.tphase .tx{font-size:11.5px;color:var(--tinta-tenue);margin-top:4px;padding:0 8px}
.aor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.aor{padding:0;overflow:hidden;cursor:pointer}
.aor .ah{padding:15px 18px;display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--glass-brd)}
.aor .code{width:46px;height:46px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;font:700 15px 'Oswald';letter-spacing:.04em;color:#04121a}
.aor .ht{flex:1;min-width:0}
.aor .ht .nm{font:600 15px 'Oswald';letter-spacing:.04em;text-transform:uppercase}
.aor .ht .pm{font-size:11.5px;color:var(--tinta-tenue);font-family:'JetBrains Mono';margin-top:2px}
.aor .ab{padding:14px 18px;font-size:12.5px;color:var(--tinta-tenue);line-height:1.5}
.aor .ab .deps{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.aor .ab .deps span{background:rgba(120,160,220,.1);border:1px solid var(--glass-brd);border-radius:6px;padding:2px 8px;font-size:11px;color:var(--tinta)}
.aor .taskwrap{max-height:0;overflow:hidden;transition:max-height .45s cubic-bezier(.22,1,.36,1)}
.aor.exp .taskwrap{max-height:680px}
.aor .tasks{padding:0 18px 16px}
.aor .tasks .tk{display:flex;gap:10px;font-size:12.5px;color:var(--tinta);margin-top:10px;line-height:1.45}
.aor .tasks .tk .n{flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:rgba(34,211,238,.14);color:var(--cian);display:grid;place-items:center;font:700 11px 'JetBrains Mono'}
.aor .expand{padding:10px 18px;border-top:1px dashed var(--glass-brd);font:600 11px 'Oswald';letter-spacing:.1em;text-transform:uppercase;color:var(--cian);display:flex;align-items:center;gap:8px;justify-content:space-between}
.aor.featured{border-color:var(--ambar);box-shadow:var(--sombra),0 0 24px -6px rgba(245,165,36,.4)}
.aor.featured .ah{background:linear-gradient(90deg,rgba(245,165,36,.1),transparent)}
.starf{color:var(--ambar);font-size:11px}
.func-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.func .fh{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.func .fi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:rgba(192,132,252,.14);border:1px solid rgba(192,132,252,.3)}
.func .fi svg{width:20px;height:20px}
.func .ft{font:600 14px 'Oswald';letter-spacing:.04em}
.func .fsig{font-family:'JetBrains Mono';font-size:11px;color:var(--conjunto)}
.func p{font-size:12.5px;color:var(--tinta-tenue);line-height:1.5;margin:6px 0 0}
.instr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.instr h4{margin:0 0 6px;font:600 13px 'Oswald';letter-spacing:.04em;color:var(--cian)}
.instr p{margin:0;font-size:12.5px;color:var(--tinta-tenue);line-height:1.5}
.glos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;max-height:440px;overflow:auto;padding:4px}
.glos{padding:12px 14px}
.glos .gs{font:700 13px 'JetBrains Mono';color:var(--ambar)}
.glos .gd{font-size:12px;color:var(--tinta-tenue);margin-top:3px;line-height:1.4}

/* Orden de batalla */
.obat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:1000px){.obat-grid{grid-template-columns:1fr}}
.obat h4{margin:0 0 4px;font:600 14px 'Oswald';letter-spacing:.04em;color:var(--tinta);display:flex;align-items:center;gap:9px}
.obat .force-dot{width:10px;height:10px;border-radius:3px}
.obat .div{margin-top:12px}
.obat .div .dn{font:600 11px 'Oswald';letter-spacing:.06em;color:var(--cian);text-transform:uppercase;margin-bottom:7px}
.unitrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;transition:background .2s}
.unitrow:hover{background:rgba(120,160,220,.07)}
.unitrow .nato{flex:0 0 auto}
.unitrow .un{font:600 12.5px 'Manrope';color:var(--tinta)}
.unitrow .ud{font-size:11.5px;color:var(--tinta-mut)}
.chiplist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chiplist span{background:rgba(34,211,238,.08);border:1px solid var(--glass-brd);border-radius:6px;padding:3px 9px;font-size:11px;color:var(--tinta-tenue)}
.nato-legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.nato-legend .nl{display:flex;align-items:center;gap:11px;padding:9px 11px;background:var(--glass-bg);border:1px solid var(--glass-brd);border-radius:10px}
.nato-legend .nl .t{font-size:12.5px;color:var(--tinta);font-weight:600}
.nato-legend .nl .d{font-size:11px;color:var(--tinta-mut)}

.prose{max-width:860px}
.prose h3{color:var(--cian);font-family:'Oswald';letter-spacing:.04em}
.prose li{margin:7px 0;color:var(--tinta-tenue)}
.prose b{color:var(--tinta)}

/* Doctrina logística (Tema 4) */
.t4-head{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;padding:20px 22px}
.t4-head .seal{width:80px;height:80px;border-radius:16px;flex:0 0 auto;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#e6f6fb,#fff);border:1px solid var(--glass-brd-hi);box-shadow:var(--glow-cian)}
.t4-head .seal svg{width:42px;height:42px}
.t4-head .m{flex:1;min-width:280px}
.t4-head .m h2{margin:0 0 6px;font:600 22px 'Oswald';letter-spacing:.04em;background:var(--grad-titulo);-webkit-background-clip:text;background-clip:text;color:transparent}
.t4-head .m p{margin:0;font-size:13.5px;color:var(--tinta-tenue);line-height:1.6}
.t4-head .m p em{color:var(--cian);font-style:normal}
.t4-prem{display:inline-block;margin-top:10px;font:600 11px 'Oswald';letter-spacing:.08em;text-transform:uppercase;color:var(--ambar);background:rgba(245,165,36,.1);border:1px solid rgba(245,165,36,.4);border-radius:20px;padding:5px 12px}
.t4-elem{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.t4-elem .e{background:rgba(8,145,178,.08);border:1px solid var(--glass-brd);border-radius:8px;padding:6px 11px;font-size:12px;color:var(--tinta)}
.t4-elem .e b{color:var(--cian)}
.t4-note{font-size:11.5px;color:var(--tinta-mut);line-height:1.5;border-left:3px solid var(--ambar);padding:8px 12px;background:rgba(245,165,36,.06);border-radius:0 8px 8px 0;margin:0}
.t4-note b{color:var(--tinta-tenue)}
.t4-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 4px}
.t4-toolbar label{font:600 11px 'Oswald';letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-mut)}
.t4-toolbar select{background:#fff;border:1px solid var(--glass-brd);color:var(--tinta);padding:9px 13px;border-radius:10px;font:14px 'Manrope';outline:none}
.t4-toolbar select:focus{border-color:var(--glass-brd-hi);box-shadow:var(--glow-cian)}
.fn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fn{padding:14px 16px}
.fn .fh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.fn .fn-nm{font:600 13.5px 'Oswald';letter-spacing:.03em;color:var(--tinta)}
.fn .fn-sc{font:800 17px 'JetBrains Mono'}
.fn .fn-bar{height:6px;border-radius:4px;background:rgba(30,64,110,.1);overflow:hidden;margin:6px 0 8px}
.fn .fn-bar i{display:block;height:100%;border-radius:4px}
.fn .fn-def{font-size:12px;color:var(--tinta-tenue);line-height:1.45}
.fn .fn-cl{margin-top:7px;display:flex;gap:4px;flex-wrap:wrap}
.fn .fn-cl span{font:600 10px 'JetBrains Mono';color:var(--cian);background:rgba(8,145,178,.1);border-radius:5px;padding:2px 6px}
.t4-class{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.t4-class .c{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;background:var(--glass-bg);border:1px solid var(--glass-brd);border-radius:9px}
.t4-class .c .n{font:700 12px 'JetBrains Mono';color:#fff;background:var(--cian);border-radius:6px;padding:2px 7px;flex:0 0 auto}
.t4-class .c .t{font-size:12px;color:var(--tinta-tenue);line-height:1.4}
.isr-wrap{display:grid;grid-template-columns:280px 1fr;gap:16px}
@media(max-width:900px){.isr-wrap{grid-template-columns:1fr}}
.isr-card{text-align:center;padding:14px}
.isr-big{font:800 46px 'JetBrains Mono';line-height:1;letter-spacing:-.02em}
.isr-cls{font:600 12px 'Oswald';letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
.isr-decomp{display:flex;flex-direction:column;gap:7px;margin-top:14px;text-align:left}
.isr-decomp .r{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--tinta-tenue)}
.isr-decomp .r .lbl{width:96px;flex:0 0 auto}
.isr-decomp .r .track{flex:1;height:8px;background:rgba(30,64,110,.1);border-radius:5px;overflow:hidden}
.isr-decomp .r .track i{display:block;height:100%;border-radius:5px}
.isr-decomp .r .v{width:34px;text-align:right;font-family:'JetBrains Mono';color:var(--tinta)}
.apr-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.apr-grid{grid-template-columns:1fr}}
.apr h4{margin:0 0 8px;font:600 13px 'Oswald';letter-spacing:.04em;color:var(--cian);display:flex;align-items:center;gap:8px}
.apr .item{padding:9px 0;border-bottom:1px solid var(--glass-brd);font-size:12.5px;color:var(--tinta)}
.apr .item:last-child{border-bottom:none}
.apr .item .sub{font-size:11.5px;color:var(--tinta-mut);margin-top:2px;line-height:1.45}
.apr .crit{display:inline-block;font:700 9.5px 'Oswald';letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:20px;margin-left:6px}
.apr .crit.alta{background:rgba(225,29,72,.14);color:var(--rojo)}
.apr .crit.media{background:rgba(217,119,6,.16);color:var(--amarillo)}

/* Créditos */
.creditos{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:22px 24px;margin-top:18px}
.creditos .logo{flex:0 0 auto;background:#fff;border:1px solid var(--glass-brd);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
.creditos .logo img{display:block;height:62px;width:auto}
.creditos .cr{min-width:240px}
.creditos .cr .ti{font:600 11px 'Oswald';letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-mut);margin-bottom:10px}
.creditos .cr .person{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px;color:var(--tinta)}
.creditos .cr .person .rk{font:600 10px 'Oswald';letter-spacing:.06em;text-transform:uppercase;color:#04121a;background:var(--grad-acento);padding:3px 8px;border-radius:20px;flex:0 0 auto}
.creditos .cr .person b{font-weight:700}
.creditos .cr .inst{font-size:12px;color:var(--tinta-tenue);margin-top:10px}
.sb-credit{border-top:1px solid var(--glass-brd);padding:12px 14px;display:flex;align-items:center;gap:10px}
.sb-credit img{height:34px;width:auto;background:#fff;border-radius:7px;padding:3px;border:1px solid var(--glass-brd)}
.sb-credit .ct{font-size:10.5px;color:var(--tinta-mut);line-height:1.4;white-space:nowrap}
.sb-credit .ct b{color:var(--tinta-tenue);font-weight:600}
.app.collapsed .sb-credit .ct{display:none}
.app.collapsed .sb-credit{justify-content:center}

@media(max-width:820px){
  aside.sidebar{position:fixed;left:0;top:0;transform:translateX(-105%);transition:transform .3s}
  .app.mobileopen aside.sidebar{transform:none}
  .menu-btn{display:grid;place-items:center}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>

    // 4) estructura COL/COLOC/CODA
    html += '<div class="section-label">Arquitectura del Sistema Logístico Conjunto</div>' +
      '<div class="chart reveal"><div class="hint">COL → COLOC → CODA y su instancia real en el teatro Caribe</div><div id="t4tree" class="ec" style="height:420px"></div></div>';
    html += '<div class="fn-grid" id="t4estr" style="margin-top:4px"></div>';

    // 11 clases
    html += '<div class="section-label">Clases de artículos de abastecimiento</div><div class="t4-class">' +
      T4.clases.map(function (c) { return '<div class="c reveal"><span class="n">' + esc(c.num) + '</span><span class="t">' + esc(c.nombre) + "</span></div>"; }).join("") + "</div>";

    // (Las prioridades de sostenimiento §8 —nodos decisivos, matriz, principios—
    //  viven en su propia vista «Prioridades de sostenimiento».)
    html += '<p class="t4-note reveal" style="margin-top:14px">▸ La jerarquía de <b>nodos decisivos</b>, la <b>matriz de prioridades</b> y las funciones críticas del §8 están en la vista <b>«Prioridades de sostenimiento»</b>.</p>';

    pad.innerHTML = html;
    reveal(pad);

    // poblar selector
    // Departamentos con dato completo para el proxy ISR (excluye los 'estimado'
    // como Córdoba, cuya capacidad real no puede puntuarse sin tejido empresarial/
    // hospitalario/orgánico cargado; aparecen igual en mapa, tablero y datos).
    var anDeps = D.departamentos.filter(function (d) { return !d.estimado; });
    var sel = $("#t4dep");
    anDeps.forEach(function (d) { var o = document.createElement("option"); o.value = d.id; o.textContent = d.nombre; sel.appendChild(o); });
    sel.value = "atlantico";

    // promedio Caribe por función (solo deptos con dato completo)
    var fkeys = T4.funciones.map(function (x) { return x.key; });
    var fnames = T4.funciones.map(function (x) { return x.nombre; });
    var avg = {}; fkeys.forEach(function (k) { var s = 0, n = 0; anDeps.forEach(function (d) { var r = R[d.id]; if (r) { s += r.funciones[k]; n++; } }); avg[k] = n ? s / n : 0; });

    var radar = mk($("#t4radar"), {}), gauge = mk($("#t4gauge"), {});

    function drawDep(id) {
      var r = R[id]; if (!r) return;
      // radar
      radar.setOption({ tooltip: tip(), legend: { bottom: 0, textStyle: { color: T.sub, fontFamily: FONT, fontSize: 10 }, itemWidth: 10, itemHeight: 10 },
        radar: { indicator: fnames.map(function (n) { return { name: n, max: 100 }; }), radius: "64%", center: ["50%", "47%"],
          axisName: { color: T.sub, fontSize: 10, fontFamily: FONT }, splitLine: { lineStyle: { color: T.line } },
          splitArea: { areaStyle: { color: ["rgba(8,145,178,.03)", "rgba(8,145,178,.07)"] } }, axisLine: { lineStyle: { color: T.line } } },
        series: [{ type: "radar", data: [
          { value: fkeys.map(function (k) { return Math.round(r.funciones[k]); }), name: r.nombre, lineStyle: { color: T.cyan, width: 2 }, itemStyle: { color: T.cyan }, areaStyle: { color: "rgba(8,145,178,.20)" } },
          { value: fkeys.map(function (k) { return Math.round(avg[k]); }), name: "Promedio Caribe", lineStyle: { color: T.amber, width: 1.5, type: "dashed" }, itemStyle: { color: T.amber }, areaStyle: { color: "rgba(217,119,6,.06)" } },
        ] }] }, true);
      // gauge ISR
      gauge.setOption({ series: [{ type: "gauge", startAngle: 210, endAngle: -30, min: 0, max: 100, radius: "100%", center: ["50%", "66%"],
        progress: { show: true, width: 13, itemStyle: { color: isrCol(r.clase) } }, pointer: { show: false },
        axisLine: { lineStyle: { width: 13, color: [[1, "rgba(30,64,110,.12)"]] } }, axisTick: { show: false }, splitLine: { show: false }, axisLabel: { show: false }, anchor: { show: false }, title: { show: false },
        detail: { valueAnimation: true, formatter: function (v) { return Math.round(v); }, color: isrCol(r.clase), fontFamily: MONO, fontSize: 34, fontWeight: 800, offsetCenter: [0, "2%"] }, data: [{ value: Math.round(r.isr) }] }] }, true);
      // descomposición
      var deco = [["Capacidad funcional", r.capacidad, T.cyan], ["Orgánico", r.organico, T.ejercito], ["Complementario", r.complementario, T.indigo], ["Fragilidad (−)", r.fragilidad, T.rojo]];
      $("#t4decomp").innerHTML = '<div style="text-align:center;font:600 12px Oswald;letter-spacing:.1em;text-transform:uppercase;color:' + isrCol(r.clase) + '">' + ({ A: "Sostenible", M: "Condicionado", B: "Crítico" }[r.clase]) + "</div>" +
        deco.map(function (x) { return '<div class="r"><span class="lbl">' + x[0] + '</span><span class="track"><i style="width:' + Math.round(x[1]) + '%;background:' + x[2] + '"></i></span><span class="v">' + Math.round(x[1]) + "</span></div>"; }).join("");

      // apreciación: brecha dominante + complementario
      var fns = fkeys.map(function (k, i) { return { k: k, nombre: fnames[i], v: r.funciones[k] }; }).sort(function (a, b) { return a.v - b.v; });
      var so = r.soporte;
      $("#t4aprL").innerHTML = '<h4>Apreciación de sostenimiento · ' + esc(r.nombre) + "</h4>" +
        '<div class="item"><b>Brecha dominante:</b> ' + esc(fns[0].nombre) + ' <span style="color:' + fnCol(fns[0].v) + ';font-family:JetBrains Mono">(' + Math.round(fns[0].v) + ")</span>" +
        '<div class="sub">Función con menor puntaje — foco del esfuerzo de sostenimiento.</div></div>' +
        '<div class="item"><b>Fortaleza:</b> ' + esc(fns[fns.length - 1].nombre) + ' <span style="color:' + fnCol(fns[fns.length - 1].v) + ';font-family:JetBrains Mono">(' + Math.round(fns[fns.length - 1].v) + ")</span></div>" +
        '<div class="item"><b>Apoyo complementario disponible:</b><div class="sub">' + so.empN + " empresas (apoyo contractual/GSED) · " + so.corredores + " corredores logísticos · base de recepción multimodal.</div></div>" +
        '<div class="item"><b>Capacidad orgánica:</b><div class="sub">' + so.unidades + " unidades militares · UCI " + so.uci + " camas · " + so.eds + " EDS (Clase III).</div></div>";

      var nodos = (T4.nodosCriticos || []).filter(function (n) { return n.dep === r.nombre; });
      var rutas = (T4.rutasVulnerables || []).filter(function (rt) { return new RegExp(r.nombre.split(" ")[0], "i").test(rt.ruta) || /Caribe|Magdalena/i.test(rt.ruta); });
      $("#t4aprR").innerHTML = '<h4>Nodos críticos y rutas (§4.5)</h4>' +
        (nodos.length ? nodos.map(function (n) { return '<div class="item"><b>' + esc(n.nodo) + '</b><span class="crit ' + n.criticidad + '">' + n.criticidad + '</span><div class="sub">' + esc(n.razon) + "</div></div>"; }).join("") : '<div class="item"><div class="sub">Sin nodo crítico propio registrado; depende de nodos del teatro.</div></div>') +
        '<div class="item" style="border-top:1px dashed var(--glass-brd);padding-top:10px"><b>Rutas que lo afectan:</b>' +
        (rutas.length ? rutas.map(function (rt) { return '<div class="sub">▸ ' + esc(rt.ruta) + "</div>"; }).join("") : '<div class="sub">—</div>') + "</div>";

      // tarjetas de funciones para el depto
      $("#t4fnCards").innerHTML = T4.funciones.map(function (fn) { var v = r.funciones[fn.key];
        return '<div class="card fn reveal"><div class="fh"><span class="fn-nm">' + esc(fn.nombre) + '</span><span class="fn-sc" style="color:' + fnCol(v) + '">' + Math.round(v) + "</span></div>" +
          '<div class="fn-bar"><i style="width:' + Math.round(v) + '%;background:' + fnCol(v) + '"></i></div>' +
          '<div class="fn-def">' + esc(fn.definicion) + "</div>" +
          '<div class="fn-def" style="margin-top:6px;color:var(--tinta-mut)"><b style="color:var(--cian)">Activo:</b> ' + esc(fn.activo) + "</div>" +
          '<div class="fn-cl">' + fn.clases.map(function (c) { return "<span>Clase " + esc(c) + "</span>"; }).join("") + "</div></div>"; }).join("");
      reveal($("#t4fnCards"));
    }
    sel.addEventListener("change", function () { drawDep(this.value); });
    drawDep("atlantico");

    // 3) heatmap función × depto
    var deps = anDeps;
    var hd = [];
    deps.forEach(function (d, x) { fkeys.forEach(function (k, y) { hd.push([x, y, Math.round(R[d.id].funciones[k])]); }); });
    mk($("#t4heat"), {
      tooltip: tip({ formatter: function (p) { return "<b>" + deps[p.data[0]].nombre + "</b><br>" + fnames[p.data[1]] + ": <b>" + p.data[2] + "</b>/100"; } }),
      grid: { left: 110, right: 16, top: 8, bottom: 70 },
      xAxis: { type: "category", data: deps.map(function (d) { return d.nombre.length > 11 ? d.capital : d.nombre; }), axisLabel: { color: T.sub, fontFamily: FONT, fontSize: 10, rotate: 38 }, axisLine: { lineStyle: { color: T.line } }, splitArea: { show: false } },
      yAxis: { type: "category", data: fnames, axisLabel: { color: T.sub, fontFamily: FONT, fontSize: 11 }, axisLine: { lineStyle: { color: T.line } } },
      visualMap: { min: 0, max: 100, show: false, inRange: { color: [T.B, T.M, T.A] } },
      series: [{ type: "heatmap", data: hd, itemStyle: { borderColor: "#fff", borderWidth: 3, borderRadius: 5 },
        label: { show: true, formatter: function (p) { return p.data[2]; }, color: "#fff", fontFamily: MONO, fontWeight: 700, fontSize: 10.5 },
        emphasis: { itemStyle: { shadowBlur: 10, shadowColor: "rgba(8,145,178,.5)" } } }] });

    // 4) árbol COL/COLOC/CODA
    var tree = {
      name: "COL", value: "Centro de Operaciones Logística · COGFM",
      itemStyle: { color: T.amber }, label: { fontWeight: 700 },
      children: [{ name: "COLOC", value: "Comando Logístico Conjunto · CCON 1 / CFNC", itemStyle: { color: T.cyan },
        children: [{ name: "CODA · BRLOG3", value: "Comando de Apoyo del T.O.", itemStyle: { color: T.ejercito },
          children: T4.brazosCODA.map(function (b) { return { name: b.sigla, value: b.funcion + " · " + b.sede, itemStyle: { color: T.indigo } }; })
            .concat([{ name: "Sanidad", value: "Red hospitalaria (Clase VIII)", itemStyle: { color: T.rojo } },
                     { name: "Complementario", value: "Empresas / GSED / nación anfitriona", itemStyle: { color: T.conjunto } }]) }] }],
    };
    mk($("#t4tree"), {
      tooltip: tip({ trigger: "item", formatter: function (p) { return "<b>" + p.name + "</b>" + (p.data.value ? "<br>" + p.data.value : ""); } }),
      series: [{ type: "tree", data: [tree], top: "6%", left: "12%", bottom: "6%", right: "22%", symbolSize: 12, orient: "LR",
        label: { position: "right", color: T.text, fontFamily: FONT, fontSize: 12, fontWeight: 600, align: "left" },
        leaves: { label: { position: "right" } }, expandAndCollapse: false,
        lineStyle: { color: T.line, width: 1.4, curveness: .35 }, initialTreeDepth: -1,
        emphasis: { focus: "descendant" }, animationDuration: 700 }] });

    // fichas de estructura
    $("#t4estr").innerHTML = T4.estructura.map(function (e) {
      return '<div class="card reveal" style="padding:14px 16px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span style="font:700 13px JetBrains Mono;color:#fff;background:var(--cian);border-radius:6px;padding:3px 8px">' + esc(e.sigla) + '</span><span style="font:600 12.5px Oswald;color:var(--tinta)">' + esc(e.nombre) + "</span></div>" +
        '<div style="font-size:11px;color:var(--tinta-mut);margin-bottom:6px">' + esc(e.nivel) + "</div>" +
        '<div style="font-size:12px;color:var(--tinta-tenue);line-height:1.45">' + esc(e.desc) + "</div>" +
        '<div style="font-size:12px;color:var(--tinta);line-height:1.45;margin-top:8px"><b style="color:var(--cian)">En el Caribe:</b> ' + esc(e.real) + " — " + esc(e.realDesc) + "</div></div>";
    }).join("");
    reveal($("#t4estr"));
  }

  /* ============================================================
     PRIORIDADES DE SOSTENIMIENTO (§8)
     ============================================================ */
  function buildPrioridades() {
    var pad = $("#prioridadesPad"), T4 = window.TEMA4; if (!T4) { pad.innerHTML = "<p class='count'>Datos no disponibles.</p>"; return; }
    var ccon1S = null; try { ccon1S = (window.PUCC.comandos || []).filter(function (c) { return c.sigla === "CCON 1"; })[0]; } catch (e) {}
    var sost = ccon1S && ccon1S.sostenimiento;
    var html = "";
    if (sost) {
      html += '<div class="t4-head glass reveal" style="border-radius:var(--r-lg)"><div class="seal"><svg viewBox="0 0 24 24" fill="none" stroke="' + T.cyan + '" stroke-width="1.4"><path d="M4 6h16M4 12h10M4 18h6"/></svg></div>' +
        '<div class="m"><h2>Prioridades de sostenimiento · CCON 1 «Caribe»</h2><p>' + esc(sost.pregunta) + '</p><span class="t4-prem">' + esc(sost.directriz) + '</span></div></div>';
      html += '<div class="reveal" style="font:700 14px Oswald;letter-spacing:.06em;color:#d97706;text-align:center;padding:11px;border:1px dashed var(--glass-brd);border-radius:10px;margin:14px 0">' + esc(sost.lema) + '</div>';
    }
    // 7 funciones críticas (orden de priorización)
    html += '<div class="section-label">Funciones críticas (qué se sostiene primero)</div><div class="fn-grid">' +
      (T4.funcionesCriticas || []).map(function (f) { return '<div class="card reveal" style="padding:13px 15px"><div style="display:flex;align-items:center;gap:9px;margin-bottom:5px"><span style="font:800 15px JetBrains Mono;color:var(--cian)">' + f.orden + '</span><b style="font:600 12.5px Oswald">' + esc(f.nombre) + '</b></div><div style="font-size:11.5px;color:var(--tinta-tenue);line-height:1.4">' + esc(f.desc) + '</div></div>'; }).join("") + '</div>';
    // matriz de prioridades
    var pcol = { ALTA: "#e11d48", MEDIA: "#d97706", BAJA: "#16a34a" };
    html += '<div class="section-label">Matriz de prioridades de sostenimiento</div><div class="chart reveal" style="padding:0"><table class="data"><thead><tr><th>Prioridad</th><th>Función crítica</th><th>Qué se sostiene</th><th>Nodos / corredores</th><th>Impacto</th></tr></thead><tbody>' +
      (T4.matrizPrioridades || []).map(function (r) { return '<tr><td><b style="color:' + pcol[r.prioridad] + '">' + esc(r.prioridad) + '</b></td><td><b>' + esc(r.funcion) + '</b></td><td>' + esc(r.sostiene) + '</td><td style="color:var(--tinta-mut)">' + esc(r.nodos) + '</td><td style="color:var(--tinta-tenue)">' + esc(r.impacto) + '</td></tr>'; }).join("") + '</tbody></table></div>';
    // nodos decisivos
    html += '<div class="section-label">Nodos decisivos (orden de prioridad)</div><div class="fn-grid">' +
      (T4.nodosDecisivos || []).map(function (n) { var col = (T4.nodoSemColor && T4.nodoSemColor[n.semaforo]) || "#d97706";
        return '<div class="card reveal" style="padding:12px 14px;border-left:4px solid ' + col + '"><div style="display:flex;align-items:center;gap:8px"><span style="font:800 17px JetBrains Mono;color:' + col + '">#' + n.prioridad + '</span><b style="font:600 13px Oswald">' + esc(n.nodo) + '</b></div><div style="font-size:11.5px;color:var(--tinta-mut);margin-top:4px">' + esc(n.tipoNodo) + '</div><div style="font-size:12px;margin-top:4px;color:var(--tinta-tenue)">' + esc(n.funcion) + '</div></div>'; }).join("") + '</div>';
    // principios y criterios de priorización
    html += '<div class="section-label">Principios de priorización</div><div class="t4-class">' +
      (T4.principiosPriorizacion || []).map(function (p) { return '<div class="c reveal"><span class="t" style="font-size:12px">' + esc(p) + '</span></div>'; }).join("") + '</div>';
    html += '<div class="section-label">Criterios para priorizar</div><div class="fn-grid">' +
      (T4.criteriosPriorizacion || []).map(function (c) { return '<div class="card reveal" style="padding:11px 14px;font-size:12px;color:var(--tinta-tenue)">▸ ' + esc(c) + '</div>'; }).join("") + '</div>';
    pad.innerHTML = html; reveal(pad);
  }

  /* ============================================================
     PLAN DE MOVIMIENTOS Y TRANSPORTE (§7)
     ============================================================ */
  function buildMovimientos() {
    var pad = $("#movimientosPad"), T4 = window.TEMA4; if (!T4) { pad.innerHTML = "<p class='count'>Datos no disponibles.</p>"; return; }
    var html = '<div class="t4-note reveal" style="margin:4px 0 12px">Esquema de sostenimiento conjunto: el flujo va del <b>origen estratégico nacional</b> a los <b>nodos estratégicos</b> del Caribe, de allí a <b>nodos avanzados</b> y a las <b>unidades</b> en el AOR. Fuente: presentación oficial CCON 1 (§6–7).</div>';
    // prioridades de transporte
    html += '<div class="section-label">Prioridades de transporte</div><div class="fn-grid">' +
      (T4.prioridadesTransporte || []).map(function (p) { return '<div class="card reveal" style="padding:12px 14px;display:flex;align-items:center;gap:10px"><span style="font:800 18px JetBrains Mono;color:var(--cian)">' + p.orden + '</span><span style="font-size:12.5px">' + esc(p.categoria) + '</span></div>'; }).join("") + '</div>';
    // diagrama de escalones (columnas + flechas) — topología y dirección, SIN magnitud
    // (la fuente no entrega volúmenes/toneladas; por eso no usamos Sankey de grosor).
    var F = T4.flujoSostenimiento || { niveles: [], grpColor: {} }, gc = F.grpColor;
    var cols = F.niveles.map(function (lv) {
      var boxes = lv.nodos.map(function (nm) {
        return '<div style="border-radius:9px;padding:9px 11px;background:#fff;border:1px solid var(--glass-brd);border-left:4px solid ' + gc[lv.grp] + ';font-size:11.5px;color:var(--tinta);line-height:1.35;box-shadow:0 1px 3px rgba(15,40,80,.06)">' + esc(nm) + '</div>';
      }).join("");
      return '<div style="flex:1;min-width:120px;display:flex;flex-direction:column;gap:8px">' +
        '<div style="font:700 10px Oswald;letter-spacing:.09em;text-transform:uppercase;color:' + gc[lv.grp] + ';text-align:center;padding-bottom:4px;border-bottom:2px solid ' + gc[lv.grp] + '33;margin-bottom:2px">' + esc(lv.nivel) + '</div>' + boxes + '</div>';
    });
    var arrow = '<div style="flex:0 0 auto;align-self:center;font-size:22px;font-weight:700;color:var(--tinta-mut)">▶</div>';
    html += '<div class="section-label">Flujo de sostenimiento (escalones)</div>' +
      '<div class="chart reveal"><div class="hint">Origen → nodos estratégicos → nodos avanzados → unidades · <b>topología y dirección</b> (la fuente no entrega volúmenes; no se representa magnitud)</div>' +
      '<div style="display:flex;align-items:stretch;gap:8px;margin-top:12px;flex-wrap:wrap">' + cols.join(arrow) + '</div></div>';
    // líneas de comunicación
    html += '<div class="section-label">Líneas de comunicación y transporte</div><div class="fn-grid">' +
      (T4.lineasComunicacion || []).map(function (l) { return '<div class="card reveal" style="padding:13px 15px"><b style="font:600 13px Oswald;color:var(--cian)">' + esc(l.modo) + '</b><div style="font-size:12px;color:var(--tinta-tenue);margin:5px 0;line-height:1.4">' + esc(l.desc) + '</div>' + (l.corredores || []).map(function (c) { return '<div style="font-size:11px;color:var(--tinta-mut)">▸ ' + esc(c) + '</div>'; }).join("") + '</div>'; }).join("") + '</div>';
    // zonas logísticas + nodos interior
    html += '<div class="section-label">Zonas logísticas de profundidad</div><div class="fn-grid">' +
      (T4.zonasLogisticas || []).map(function (z) { return '<div class="card reveal" style="padding:13px 15px"><b style="font:600 13px Oswald">' + esc(z.nombre) + '</b><div style="font-size:11.5px;color:var(--tinta-tenue);margin:4px 0;line-height:1.4">' + esc(z.desc) + '</div><div style="font-size:11px;color:var(--tinta-mut)">' + esc((z.nodos || []).join(" · ")) + '</div></div>'; }).join("") + '</div>';
    html += '<div class="section-label">Nodos de retaguardia nacional (Zona del Interior)</div><div class="chart reveal" style="padding:0"><table class="data"><thead><tr><th>Ciudad</th><th>Rol en el sostenimiento</th></tr></thead><tbody>' +
      (T4.nodosInterior || []).map(function (n) { return '<tr><td><b>' + esc(n.ciudad) + '</b></td><td style="color:var(--tinta-tenue)">' + esc(n.rol) + '</td></tr>'; }).join("") + '</tbody></table></div>';
    pad.innerHTML = html; reveal(pad);
  }

  /* ============================================================
     RIESGOS, FRICCIONES Y RESILIENCIA (§9-10)
     ============================================================ */
  function buildRiesgos() {
    var pad = $("#riesgosPad"), T4 = window.TEMA4; if (!T4) { pad.innerHTML = "<p class='count'>Datos no disponibles.</p>"; return; }
    var cats = T4.categoriasRiesgo || [], riesgos = T4.riesgos || [];
    var html = '<div class="t4-note reveal" style="margin:4px 0 12px">Factores que pueden degradar el sostenimiento, su impacto en las operaciones y las medidas de resiliencia. Fuente: presentación oficial CCON 1 (§9–10).</div>';
    html += '<div class="section-label">Riesgos, fricciones y limitaciones (' + riesgos.length + ' factores · 6 categorías)</div><div class="fn-grid">';
    cats.forEach(function (c) {
      var items = riesgos.filter(function (r) { return r.cat === c.key; });
      html += '<div class="card reveal" style="padding:13px 15px;border-top:4px solid ' + c.color + '"><b style="font:600 13px Oswald;color:' + c.color + '">' + esc(c.nombre) + ' <span style="color:var(--tinta-mut);font-weight:400">(' + items.length + ')</span></b>' +
        '<div style="font-size:10.5px;color:var(--tinta-mut);margin:4px 0 7px;line-height:1.35">' + esc(c.def) + '</div>' +
        items.map(function (r) { return '<div style="font-size:11.5px;color:var(--tinta-tenue);margin-bottom:5px;line-height:1.35">• ' + esc(r.factor) + '</div>'; }).join("") + '</div>';
    });
    html += '</div>';
    // impacto + acciones
    html += '<div class="grid12" style="margin-top:8px">';
    html += '<div class="card col-6 reveal" style="padding:14px 16px"><b style="font:600 12px Oswald;letter-spacing:.06em;text-transform:uppercase;color:#e11d48">Impacto en las operaciones</b>' +
      (T4.impactosOperaciones || []).map(function (t) { return '<div style="font-size:12px;color:var(--tinta-tenue);margin-top:6px">▸ ' + esc(t) + '</div>'; }).join("") + '</div>';
    html += '<div class="card col-6 reveal" style="padding:14px 16px"><b style="font:600 12px Oswald;letter-spacing:.06em;text-transform:uppercase;color:#16a34a">Acciones clave</b>' +
      (T4.accionesClave || []).map(function (t) { return '<div style="font-size:12px;color:var(--tinta-tenue);margin-top:6px">▸ ' + esc(t) + '</div>'; }).join("") + '</div></div>';
    // medidas de resiliencia
    html += '<div class="section-label">Medidas de resiliencia (10)</div><div class="fn-grid">' +
      (T4.medidasResiliencia || []).map(function (m) { return '<div class="card reveal" style="padding:13px 15px"><div style="display:flex;align-items:center;gap:9px;margin-bottom:5px"><span style="font:800 15px JetBrains Mono;color:var(--cian)">' + m.n + '</span><b style="font:600 12.5px Oswald">' + esc(m.nombre) + '</b></div><div style="font-size:11.5px;color:var(--tinta-tenue);line-height:1.4">' + esc(m.desc) + '</div></div>'; }).join("") + '</div>';
    // brechas del atlas re-mapeadas
    html += '<div class="section-label">Brechas logísticas consolidadas (Atlas)</div><div class="chart reveal" style="padding:0"><table class="data"><thead><tr><th>Brecha</th><th>Departamentos</th><th>Impacto</th></tr></thead><tbody>' +
      (D.brechas || []).map(function (b) { return '<tr><td><b>' + esc(b.brecha) + '</b></td><td style="color:var(--tinta-mut)">' + esc(b.deps.join(", ")) + '</td><td style="color:var(--tinta-tenue)">' + esc(b.impacto) + '</td></tr>'; }).join("") + '</tbody></table></div>';
    pad.innerHTML = html; reveal(pad);
  }

  /* ============================================================
     GSED / Capacidades no orgánicas (nación anfitriona)
     ============================================================ */
  function buildGsed() {
    var pad = $("#gsedPad");
    var cap = X.capacidadesNoOrganicas || [], gsed = X.gsed || [], gc = X.gsedColor || {}, apo = X.apoyosInterinstitucionales || [];
    var nComb = (D.centrosCombustible || []).length, nAcop = (D.centrosAcopio || []).length;
    var html = '';
    html += '<div class="t4-note reveal" style="margin:4px 0 12px">El sostenimiento del CCON 1 integra, además de las capacidades orgánicas, la <b>infraestructura civil, el ecosistema empresarial y el apoyo interinstitucional</b> (nación anfitriona). Fuente: presentación oficial «Sostenimiento Logístico Conjunto CCON No.1 Caribe».</div>';

    // 9 categorías no orgánicas
    html += '<div class="section-label">Capacidades no orgánicas a integrar (9 categorías)</div><div class="fn-grid">';
    cap.forEach(function (c) {
      html += '<div class="card reveal" style="padding:13px 15px"><div style="display:flex;align-items:center;gap:9px;margin-bottom:5px"><span style="font:800 14px JetBrains Mono;color:var(--cian)">' + c.n + '</span><b style="font:600 13px Oswald">' + esc(c.nombre) + '</b></div><div style="font-size:12px;color:var(--tinta-tenue);line-height:1.45">' + esc(c.desc) + '</div></div>';
    });
    html += '</div>';

    // resumen de nodos no orgánicos del Atlas
    html += '<div class="section-label">Inventario en el Atlas</div><div class="kpis">';
    [[nComb, "Centros de combustible", "Clase III · Ecopetrol/Terpel"], [nAcop, "Centros de acopio", "7 privados · 2 gobernación"], [gsed.length, "Entidades GSED", "Apoyo estratégico"], [apo.length, "Apoyos interinstitucionales", "Aerocivil, DIAN, PONAL…"]].forEach(function (k) {
      html += card('<div class="v"><span data-count="' + k[0] + '">0</span></div><div class="l">' + k[1] + '</div><div class="s">' + k[2] + "</div>", "card kpi", true);
    });
    html += '</div>';

    // GSED — Grupo Social y Empresarial de la Defensa
    html += '<div class="section-label">GSED · Grupo Social y Empresarial de la Defensa</div><div class="fn-grid">';
    gsed.forEach(function (g) { var col = gc[g.sector] || "#6366f1";
      html += '<div class="card reveal" style="padding:12px 14px;border-left:4px solid ' + col + '"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><b style="font:700 13px JetBrains Mono;color:' + col + '">' + esc(g.sigla) + '</b><span style="font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta-mut)">' + esc(g.sector) + '</span></div><div style="font-size:11.5px;color:var(--tinta);margin-top:4px">' + esc(g.nombre) + '</div><div style="font-size:11.5px;color:var(--tinta-tenue);margin-top:5px;line-height:1.4">' + esc(g.aporte) + '</div></div>';
    });
    html += '</div>';

    // Apoyos interinstitucionales
    html += '<div class="section-label">Apoyos interinstitucionales (nación anfitriona)</div>' +
      '<div class="chart reveal" style="padding:0"><table class="data"><thead><tr><th>Entidad</th><th>Capacidades de apoyo</th></tr></thead><tbody>';
    apo.forEach(function (a) { html += '<tr><td><b>' + esc(a.entidad) + '</b></td><td style="color:var(--tinta-tenue)">' + esc((a.capacidades || []).join(" · ")) + '</td></tr>'; });
    html += '</tbody></table></div>';

    pad.innerHTML = html; reveal(pad); countAll(pad);
  }

  var BUILD = { tablero: buildTablero, corredores: buildCorredores, tablas: buildTablas, red: buildRed, orbat: buildOrbat, doctrina: buildDoctrina, doctrinalog: buildDoctrinaLog, prioridades: buildPrioridades, movimientos: buildMovimientos, riesgos: buildRiesgos, gsed: buildGsed, acerca: buildAcerca };

  /* ---------- créditos en sidebar ---------- */
  (function () {
    var el = $("#sbCredit"); if (!el) return;
    el.innerHTML = (window.ESDEGUE_LOGO ? '<img src="' + window.ESDEGUE_LOGO + '" alt="ESDEG">' : "") +
      '<div class="ct"><b>MY (IM) Carlos Mesa</b><br><b>CC Lorena Travecedo</b><br><b>MY Cristian Camargo</b><br><b>MY Manuel Castaneda</b><br><b>MY Cristian Rozo</b><br><b>MY Karol Salazar</b><br><b>CC Julián Quintero</b><br>Escuela Superior de Guerra</div>';
  })();

  /* ---------- init ---------- */
  initMap();
})();


</script>
